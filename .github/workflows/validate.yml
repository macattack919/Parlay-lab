name: Validate Parlay Lab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check backend JavaScript syntax
        run: |
          node --check api/scores.js
          node --check api/odds.js
          node --check api/details.js
          node --check api/live.js
          node --check lib/total-model.js
          node --check lib/live-context.js
          node --check lib/live-signals.js
      - name: Check dashboard JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((match, index) => fs.writeFileSync(`/tmp/parlay-inline-${index}.mjs`, match[1]));
          NODE
          for file in /tmp/parlay-inline-*.mjs; do node --check "$file"; done
